<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Read">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./app.css">
<title>Daily Immersive Read</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="bartitle" id="barTitle">Today's four</h1>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode"></button>
  </header>
  <main id="screen" class="screen"></main>
</div>

<div class="drawer-wrap" id="drawer" hidden>
  <div class="scrim" id="scrim"></div>
  <nav class="drawer">
    <div class="drawer-brand">Daily Read</div>
    <div class="drawer-sub" id="drawerSub">Not signed in</div>
    <div class="drawer-nav" id="drawerNav"></div>
    <div class="drawer-foot">
      <span>Dark mode</span>
      <button class="switch" id="drawerTheme" role="switch"><span></span></button>
    </div>
  </nav>
</div>

<script src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
